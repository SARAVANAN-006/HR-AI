# Server Configuration (Render injects PORT dynamically)
server.port=${PORT:8080}

# MySQL Database Configuration (Primary Storage Engine)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kodexisdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JWT Configuration
kodexis.jwt.secret=${JWT_SECRET:5f4dcc3b5aa765d61d8327deb882cf995f4dcc3b5aa765d61d8327deb882cf99}
kodexis.jwt.expiration=86400000

# Mistral AI API Settings (optional fallback for cloud deployment)
kodexis.mistral.key=${MISTRAL_API_KEY:demo_mistral_api_key}
kodexis.mistral.url=${MISTRAL_API_URL:https://api.mistral.ai/v1/chat/completions}
kodexis.mistral.model=${MISTRAL_MODEL:open-mistral-7b}
